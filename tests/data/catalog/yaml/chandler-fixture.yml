  C: Photoflare
Summary:
  C: Simple but powerful Cross Platform Image Editor
Description:
  C: >-
    <p>
          This is an effort to bring quick, simple but powerful image editing to the masses. PhotoFlare is inspired by the
    image editor currently only available on Microsoft Windows – PhotoFiltre. However, it will not be a straight clone. It
    is being built from the ground up to be much improved and cross platform too!
        </p>
    <p>Features:</p>

    <ul>
      <li>Easy quick cropping tool.</li>
      <li>Flip, Rotate and scale images.</li>
      <li>Lots of unique image filters.</li>
      <li>Batch processing tool with support for all editor features.</li>
      <li>Multiple translations are supported.</li>
    </ul>
