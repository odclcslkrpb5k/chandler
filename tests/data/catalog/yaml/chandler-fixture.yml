Description:
  zh-Hant-TW: >-
    <p>Rhythmbox 是音樂管理程式，其設計是要在 GNOME 桌面下良好運作。除了儲存在您電腦上的音樂之外，它還支援網路分享、Podcast、無線電臺串流、可攜式音樂裝置 (包括手機)、和網際網路音樂服務如 Last.fm 與 Magnatune。</p>

    <p>Rhythmbox 是自由軟體，基於 GTK+ 與 GStreamer 建置，可透過由 Python 或 C 等語言撰寫的外掛程式擴充功能。</p>
  bs-Latn: >-
    <p>Rhythmbox je aplikacija za upravljanje muzikom, dizajniran da radi dobro na GNOME desktopu. Pored muzike sačuvane na
    vašem računaru, ona podržava i dijeljenja mreže, podcaste, radio tokove, prenosive muzičke uređaje (uključujući telefone),
    i internet muzičke servise kao što su Last.fm i Magnatune.</p>

    <p>Rhythmbox je besplatan softver, baziran na GTK+ i GStreamer-u, i može se proširiti pluginima napisanim u Pythonu ili
    C-u.</p>
  vi: >-
    <p>Rhythmbox là một ứng dụng quản lý nhạc, thiết kế để làm việc tốt trên môi trường máy tính GNOME. Ngoài việc nhạc lưu
    trên máy tính của bạn, nó còn hỗ trợ chia sẻ qua mạng, podcats, luồng radio, thiết bị âm nhạc di động (bao gồm cả điện
    thoại) và các dịch vụ âm nhạc trên internet như là Last.fm và Magnatune.</p>

    <p>Rhythmbox là phần mềm miễn phí, dựa trên GTK+ và GStreamer, và được mở rộng thông qua các phần bổ xung viết bằng ngôn
    ngữ Python hay C.</p>
  eu: >-
    <p>Rhythmbox musika kudeatzeko aplikazio bat da, GNOME mahaiganean ongi funtzionatzeko diseinatu dena. Zure ordenagailuan
    gordetako musika erabiltzeaz gain, sareko musika, podcast-ak, irrati-korronteak, musika-gailu eramangarriak (telefonoak
    barne) eta interneteko musika-zerbitzuak, adibidez Last.fm eta Magnatune, onartzen ditu.</p>

    <p>Rhythmbox software librea da, GTK+ eta GStreamer programetan oinarritua, eta Python edo C lengoaietan idatzitako pluginen
    bidez hedatu daiteke.</p>
  nb: >-
    <p>Rhythmbox er et program for håndtering av musikk og er designet for GNOME skrivebordet. I tillegg til musikk lagret
    på din datamaskin støtter det delte nettverkslokasjoner, podcaster, radiostrømmer og portable musikkenheter (inklusive
    telefoner) og musikktjenester på internett som Last.fm og Magnatune.</p>

    <p>Rhythmbox er fri programvare basert på GTK+ og GStreamer og kan utvides via tillegg skrevet i Python eller C.</p>
  ja: >-
    <p>Rhythmbox は GNOME デスクトップ環境向けに設計された音楽管理アプリケーションです。コンピューターに保存された音楽に加えて、ネットワーク経由の共有、ポッドキャスト、ラジオストリーム、ポータブル音楽デバイス (スマートフォンを含む)、Last.fm
    や Magnatune などのインターネット音楽サービスにも対応しています。</p>

    <p>Rhythmbox は GTK+ と GStreamer をベースにしたフリーソフトウェアです。Python や C で書かれたプラグインによって拡張可能です。</p>
  de: >-
    <p>Rhythmbox ist ein Musikverwaltungsprogramm, welches konzipiert ist, um gut innerhalb der GNOME-Arbeitsumgebung zu laufen.
    Über die Musik hinaus, die auf Ihrem Rechner gespeichert ist, unterstützt es Netzwerkfreigaben, »Podcasts«, Radiosendungen,
    tragbare Musikgeräte (auch Telefone) und Internet-Musikdienste wie Last.fm und Magnatune.</p>

    <p>Rhythmbox ist freie Software, basierend auf GTK+ und GStreamer. Es ist mit Zusatzmodulen erweiterbar, die in Python
    oder C geschrieben sind.</p>
  oc: >-
    <p>Rhythmbox es una aplicacion de gestion de musica concebuda per s'integrar armoniosament al burèu GNOME. Amai de la
    musica emmagazinada sus vòstre ordinator, gerís los partiments ret, los podcasts, los fluxes radiofonics, los lectors
    àudios portables (incluses los telefòns), e los servicis de musica sus Internet coma Last.fm e Magnatune.</p>

    <p>Rhythmbox es un logicial liure basat sus GTK+ e GStreamer ; es extensible per d'empeutons escriches en Python o en
    C.</p>
  pt: >-
    <p>O Rhytmbox é uma aplicação de gestão de música desenhada para trabalhar bem nos ambientes de trabalho GNOME. Além de
    armazenar música no seu computador, suporta partilhas de rede, podcasts, fluxos de rádio, dispositivos de música portáteis
    (incluindo telefones) e serviços de música pela internet, tais como Last.fm e Magnatune.</p>

    <p>Rhytmbox é uma aplicação livre, baseado em GTK+ e GStreamer e é extensivel com extensões escritas em Python ou C.</p>
  gl: >-
    <p>Rhythmbox é un aplicativo de xestión musical, deseñado para traballar no escritorio GNOME. Ademais da música gardada
    no seu computador, tamén acepta comparticións de rede, fluxos de radio, dispositivos portátiles de música (incluídos teléfonos)
    e servizos de música por internet tales como Last.fm e Magnatune.</p>

    <p>Rhythmbox é software libre, baseado en GTK+ e GStreamer e ampliábel mediante engadidos escritos en Python ou C.</p>
  pt-BR: >-
    <p>Rhythmbox é um aplicativo de gerenciamento de músicas, projetado para funcionar bem sob o ambiente GNOME. Além de músicas
    armazenadas em seu computador, há suporte a compartilhamentos de rede, podcasts, streams de rádio, dispositivos de música
    portáteis (incluindo telefones), e serviços de músicas na Internet tal como Last.fm e Magnatune.</p>

    <p>Rhythmbox é um software livre, baseado no GTK+ e GStreamer, e é extensível via plug-ins escritos em Python ou C.</p>
  hr: >-
    <p>Rhythmbox je aplikacija za upravljanje glazbom, dizajnirana tako da radi u GNOME radnom okruženju. Kao dodatak glazbi
    spremljenoj na vašem računalu, podržava mrežno dijeljenje, podcaste, radio streamove, prijenosne glazbene uređaje (uključujući
    mobitele) i internet glazbene usluge poput Last.fm i Magnatune.</p>

    <p>Rhythmbox je slobodan softver, temeljen na GTK+ i GStreameru, i proširiv je putem priključaka napisanim u Pythonu ili
    C.</p>
  ru: >-
    <p>Rhythmbox — это приложение для управления музыкой, предназначенное для работы в среде GNOME. В дополнение к музыке,
    хранящейся на вашем компьютере, оно поддерживает работу по сети, подкасты, радио, портативные устройства (включая телефоны),
    а также музыкальные интернет сервисы, такие как Last.fm и Magnatune.</p>

    <p>Rhythmbox — это свободное программное обеспечение, основанное на GTK+ и GStreamer, и расширяемое с помощью модулей
    написанных на Python или C.</p>
  el: >-
    <p>Το Rhythmbox είναι μια εφαρμογή διαχειρίσης της μουσικής σας, σχεδιασμένη να λειτουργεί άριστα στο GNOME. Εκτός από
    τη μουσική που είναι αποθηκευμένη στον υπολογιστή σας, υποστηρίζει κοινόχρηστα δικτύου, ραδιοφωνικές ροές, φορητές συσκευές
    μουσικής (και κινητά τηλέφωνα), και διαδικτυακές υπηρεσίες μουσικής όπως τα Last.fm και Magnatune.</p>

    <p>Το Rhythmbox είναι ελεύθερο λογισμικό, βασισμένο στο GTK+ και το GStreamer, και είναι επεκτάσιμο με πρόσθετο γραμμένα
    σε Python ή C.</p>
  fr: >-
    <p>Rhythmbox est une application de gestion de musique conçue pour s’intégrer harmonieusement au bureau GNOME. En plus
    de la musique stockée sur votre ordinateur, elle gère les partages réseau, les podcasts, les flux radiophoniques, les
    lecteurs audio portables (y compris les téléphones), et les services de musique sur Internet comme Last.fm et Magnatune.</p>

    <p>Rhythmbox est un logiciel libre basé sur GTK+ et GStreamer ; il est extensible par des greffons écrits en Python ou
    en C.</p>
  C: >-
    <p>
          Rhythmbox is a music management application, designed to work well under the GNOME
          desktop. In addition to music stored on your computer, it supports network shares,
          podcasts, radio streams, portable music devices (including phones), and internet music
          services such as Last.fm and Magnatune.
        </p>
    <p>
          Rhythmbox is Free software, based on GTK+ and GStreamer, and is extensible via plugins
          written in Python or C.
        </p>
  ro: >-
    <p>Rhythmbox este o aplicație de administrare a muzicii, concepută pentru a funcționa bine sub mediul de desktop GNOME.
    Pe lângă muzica stocată pe calculatorul dumneavoastră, suportă partajări de rețea, podcasturi, fluxuri radio, dispozitive
    portabile de muzică (inclusiv telefoane) și servicii de muzică pe internet cum ar fi Last.fm și Magnatune.</p>

    <p>Rhythmbox este program liber, bazat pe GTK+ și GStreamer, și este extensibil prin module scrise în Python sau C.</p>
  uk: >-
    <p>Rhythmbox — програма для керування музичними даними, яку тісно інтегровано до стільниці GNOME. Окрім роботи із музичними
    файлами, які зберігаються на вашому комп'ютері, у програмі передбачено підтримку роботи зі спільними ресурсами у мережі,
    подкастами, потоками радіотрансляцій, портативними музичними пристроями (включно із телефонами) та музичними службами
    у інтернеті, зокрема Last.fm і Magnatune.</p>

    <p>Rhythmbox є вільним програмним забезпеченням, заснованим на GTK+ і GStreamer, можливості якого можна розширити за допомогою
    додатків мовами Python і C.</p>
  lt: >-
    <p>Rhythmbox yra muzikos tvarkymo programa, sukurta taip, kad gerai veiktų GNOME darbalaukyje. Be jūsų kompiuteryje esančios
    muzikos ji palaiko tinklo viešinius, tiklalaides, radijo srautus, nešiojamus muzikos įrenginius (įskaitant telefonus)
    bei internetines muzikos tarnybas, tokias kaip Last.fm ir Magnatune.</p>

    <p>Rhythmbox yra laisva programinė įranga, sukurta GTK+ ir GStreamer pagrindu, bei yra plečiama įskiepiais, parašytais
    Python arba C kalbomis.</p>
  sv: >-
    <p>Rhythmbox är ett program för musikhantering, designat för att fungera bra i skrivbordsmiljön GNOME. Förutom musik lagrad
    på din dator stöder det nätverksutdelningar, poddsändningar, radioströmmar, portabla musikenheter (inklusive mobiler)
    och musiktjänster på internet som Last.fm och Magnatune.</p>

    <p>Rhythmbox är fri programvara, baserad på GTK+ och GStreamer, och är utökningsbar genom insticksmoduler skrivna i Python
    eller C.</p>
  be-Cyrl: >-
    <p>Rhythmbox — гэта праграма для кіравання музыкай, распрацаваная для працы ў асяроддзі GNOME. У дадатак да музыкі, якая
    захоўваецца на вашым камп'ютары, падтрымліваюцца сеткавыя рэсурсы, падкасты, радыёперадачы, партатыўныя музычныя прылады
    (у тым ліку тэлефоны) і разнастайныя музычныя інтэрнэт-сэрвісы, напрыклад, Last.fm і Magnatune.</p>

    <p>Rhythmbox — свабоднае праграмнае забеспячэнне, заснаванае на GTK+ і GStreamer і з магчымасцю падлучэння плагінаў, напісаных
    на Python або C.</p>
  sk: >-
    <p>Rhythmbox je aplikácia na správu hudby navrhnutá tak, aby fungovala bezchybne v prostredí GNOME. Podporuje nielen hudobnú
    zbierku vo vašom počítači, ale tiež sprístupnenie v sieti, podcasty, rádiové prúdy, prenosné hudobné zariadenia (vrátane
    telefónov) a internetové hudobné služby ako Last.fm a Magnatune.</p>

    <p>Rhythmbox je slobodný softvér založený na knižnici GTK+ a GStreamer a rozšíriteľný pomocou zásuvných modulov vytvorených
    v jazyku Python alebo C.</p>
  ca: >-
    <p>El Rhytmbox és una aplicació de gestió de música dissenyada per a treballar amb l'escriptori GNOME. A més de gestionar
    la música que teniu al vostre ordinador, és compatible amb la compartició en xarxa, podcasts, flux de ràdio, dispositius
    de música portable (inclosos telèfons) i serveis de música d'Internet com Last.fm o Magnatune.</p>

    <p>El Rhythmbox és programari lliure, basat en GTK+ i GStreamer, i és extensible mitjançant connectors escrits en Python
    o C.</p>
  da: >-
    <p>Rhythmbox er et musikhåndteringsprogram som er designet med særligt henblik på GNOME-skrivebordet. Ud over musikken
    på din computer, understøtter Rhythmbox netværksdelinger, podcast, radiostrømme, transportable musikafspillere (inklusive
    telefoner) samt internettjenester såsom Last.fm og Magnatune.</p>

    <p>Rhythmbox er fri software baseret på GTK+ og GStreamer, og kan udvides med moduler skrevet i Python eller C.</p>
  ko: >-
    <p>리듬박스는 그놈 데스크톱에서 잘 동작하도록 설계한 음악 관리 프로그램입니다. 컴퓨터에 저장한 음악 파일에 대해 네트워크 공유, 팟캐스트, 라디오 스트리밍, 휴대용 음악 재생 장치(폰 포함), Last.fm
    및 Magnatune과 같은 인터넷 음악 서비스를 지원합니다.</p>

    <p>리듬 박스는 GTK+와 지스트리머를 기반으로 한 자유 소프트웨어이며, 파이썬 또는 C로 작성한 플러그인으로 기능을 확장할 수 있습니다.</p>
  it: >-
    <p>Rhythmbox è un'applicazione per la gestione della musica, progettata per integrarsi nell'ambiente grafico GNOME. Oltre
    alla musica archiviata nel proprio computer, supporta condivisioni di rete, podcast, radio, dispositivi portatili (compresi
    telefonini) e servizi musicali su Internet come Last.fm e Magnatune.</p>

    <p>Rhythmbox è software libero basato su GTK+ e GStreamer ed è possibile estenderne le funzionalità attraverso plugin
    scritti in Python o C.</p>
  es: >-
    <p>Rhythmbox es una aplicación de gestión de música diseñada para funcionar bien en el escritorio GNOME. Además de la
    música guardada en su equipo, soporta comparticiones de red, podcasts, flujos de radio, dispositivos de música portátil
    (incluyendo los teléfonos) y servicios de música por Internet, tales como Last.fm y Magnatune.</p>

    <p>Rhythmbox es software libre, basado en GTK+ y GStreamer, y se puede ampliar mediante complementos escritos en Python
    o en C.</p>
  hi: >-
    <p>रिदमबॉक्स एक संगीत प्रबंधन एप्लिकेशन है, जिसे गनोम डेस्कटॉप के तहत अच्छी तरह से काम करने के लिए डिज़ाइन किया गया है।
    आपके कंप्यूटर पर संग्रहीत संगीत के अलावा, यह नेटवर्क शेयर, पॉडकास्ट, रेडियो स्ट्रीम, पोर्टेबल संगीत डिवाइस (फोन सहित)
    और Last.fm और Magnatune जैसी इंटरनेट संगीत सेवाओं का समर्थन करता है।</p>

    <p>रिदमबॉक्स एक निःशुल्क सॉफ्टवेयर है, जो GTK+ और GStreamer पर आधारित है, तथा इसे पायथन या C में लिखे प्लगइन्स के माध्यम
    से विस्तारित किया जा सकता है।</p>
  sr-Cyrl: >-
    <p>Ритам машина је програм за управљање музиком, осмишљен да ради лепо под Гномовом радном површи. Поред музике ускладиштене
    на вашем рачунару, подржава мрежна дељења, подемисије, радио токове, преносне музичке уређаје (укључујући телефоне), и
    интернетне услуге музике као што су Ласт.фм и Мегатјун.</p>

    <p>Ритам машина је слободан софтвер, заснован на Гтк+ и Гстримеру, и може се проширити прикључцима писаним у Питону или
    Ц-у.</p>
  tr: >-
    <p>Rhythmbox GNOME masaüstünde iyi çalışmak üzere tasarlanmış müzik yönetim uygulamasıdır. Bilgisayarınzda kayıtlı müziğe
    ek olarak, ağ paylaşımlarını, ortam akışları, radyo akışlarını, taşınabilir müzik aygıtlarını (telefonlar dahil), ve Last.fm
    ve Magnatune gibi internet müzik hizmetlerini de destekler.</p>

    <p>Rhythmbox GTK+ ve GStreamer temelli Özgür yazılımdır, ve Python veya C ile yazılan eklentilerle geliştirilebilir.</p>
  zh-Hans-CN: >-
    <p>Rhythmbox 是一个音乐管理应用程序，主要用于 GNOME 桌面环境。除了在计算机上存储音乐，也支持网络共享，播客，电台，便携式音乐设备（包括手机），和互联网音乐服务，例如 Last.fm 和 Magnatune。</p>

    <p>Rhythmbox 是自由软件，基于 GTK+ 和 GStreamer 框架，可以通过 Python 或 C 插件扩展。</p>
  id: >-
    <p>Rhythmbox adalah sebuah aplikasi manajemen musik, dirancang untuk bekerja baik di bawah desktop GNOME. Selain musik
    yang disimpan pada komputer Anda, itu mendukung berbagi pakai jaringan, siniar, stream radio, perangkat musik portabel
    (termasuk telepon), dan layanan musik internet seperti Last.fm dan Magnatune.</p>

    <p>Rhythmbox adalah Perangkat lunak bebas, berbasis pada GTK+ dan GStreamer, dan dapat dikembangkan melalui pengaya yang
    ditulis dalam Python atau C.</p>
  sl: >-
    <p>Rhythmbox je program za upravljanje glasbe, ki je zasnovan tako, da dobro deluje na namizju GNOME. Poleg glasbe, shranjene
    na računalniku, podpira tudi omrežne mape, poddaje, radijske tokove, prenosne glasbene naprave (vključno s telefoni) in
    internetne glasbene storitve, kot sta Last.fm in Magnatune.</p>

    <p>Rhythmbox je prosto programje, ki temelji na GTK+ in GStreamer in ki ga je moč nadgrajevati z uporabo vstavkov, napisanih
    v jezikih Python in C.</p>
  fi: >-
    <p>Rytmilaatikko on sovellus musiikin hallintaan. Se tukee paikallisten tiedostojen lisäksi verkkojakoja, podcasteja,
    radiosuoratoistoja, kannettavia musiikkilaitteita (mukaan lukien puhelimia) ja internetpalveluita kuten Last.fm ja Magnatune.</p>

    <p>Rytmilaatikko on vapaa ja avoin ohjelmisto, joka pohjautuu GTK+:aan ja Gstreameriin. Rytmilaatikko on ohjelmoitu käyttäen
    Pythonia ja C:tä. Laajennuksilla on mahdollista lisätä toiminnalisuuksia Rytmilaatikkoon.</p>
  lv: >-
    <p>Rhythmbox ir mūzikas pārvaldības lietotne, kas veidota darbam GNOME vidē. Tā atbalsta ne tikai uz datora saglabātu
    mūziku, bet arī tīkla koplietojumus, raidierakstus, radio straumējumus, pārnēsājamās mūzikas ierīces (tai skaitā tālruņus)
    un interneta mūzikas pakalpojumus, piemēram, Last.fm un Magnatune.</p>

    <p>Rhythmbox ir brīvā programmatūra, kas ir balstīta uz GTK+ un GStreamer, un tā ir paplašināma ar Python un C valodās
    rakstītiem spraudņiem.</p>
  hu: >-
    <p>A Rhythmbox egy GNOME környezetbeli működésre tervezett zenekezelő alkalmazás. A számítógépén tárolt zenén túl támogatja
    a hálózati megosztásokat, podcastokat, rádióközvetítéseket, hordozható zenelejátszókat (telefonokat is) és olyan internetes
    zenei szolgáltatásokat, mint a Last.fm és Magnatune.</p>

    <p>A Rhythmbox szabad szoftver, a GTK+ és GStreamer használatával készült, és Python vagy C nyelvű bővítményekkel bővíthető.</p>
  en-GB: >-
    <p>Rhythmbox is a music management application, designed to work well under the GNOME desktop. In addition to music stored
    on your computer, it supports network shares, podcasts, radio streams, portable music devices (including phones), and
    internet music services such as Last.fm and Magnatune.</p>

    <p>Rhythmbox is Free software, based on GTK+ and GStreamer, and is extensible via plugins written in Python or C.</p>
  pl: >-
    <p>Rhythmbox to program do zarządzania muzyką, zaprojektowany do działania w środowisku GNOME. Oprócz muzyki przechowywanej
    na komputerze obsługuje on także muzykę udostępnianą w sieci, podcasty, radio internetowe, przenośne odtwarzacze muzyki
    (w tym smartfony) oraz serwisy internetowe Last.fm i Magnatune.</p>

    <p>Rhythmbox jest wolnym oprogramowaniem, opartym na bibliotekach GTK i GStreamer, i jest rozszerzalny dzięki mechanizmowi
    wtyczek napisanych w językach Python i C.</p>
  sr-Latn: >-
    <p>Ritam mašina je program za upravljanje muzikom, osmišljen da radi lepo pod Gnomovom radnom površi. Pored muzike uskladištene
    na vašem računaru, podržava mrežna deljenja, podemisije, radio tokove, prenosne muzičke uređaje (uključujući telefone),
    i internetne usluge muzike kao što su Last.fm i Megatjun.</p>

    <p>Ritam mašina je slobodan softver, zasnovan na Gtk+ i Gstrimeru, i može se proširiti priključcima pisanim u Pitonu ili
    C-u.</p>
  th: >-
    <p>Rhythmbox เป็นโปรแกรมจัดการเพลง และออกแบบมาเพื่อทำงานร่วมกับ GNOME นอกเหนือจากการจัดเก็บเพลงแล้ว โปรแกรมดังกล่าวยังสนับสนุนการแชร์บนเครือข่าย
    พอดแคสต์ วิทยุออนไลน์ รวมไปถึงเครื่องเล่นเพลงแบบพกพา (รวมถึง โทรศัพท์มือถือ) และบริการเพลงบนอินเตอร์เน็ต อย่างเช่น Last.fm
    และ Magnatune</p>

    <p>Rhythmbox เป็นโปรแกรมฟรี ที่พัฒนาด้วย GTK+ และ GStreamer และสนับสนุนโปรแกรมเสริมที่พัฒนาโดยภาษา Python หรือ C</p>
  gd: >-
    <p>Cuiridh tu rian air a' cheòl agad le Rhythmbox 's a chaidh a dhealbhadh ach an obraich e gu ma air an deasg GNOME.
    A bharrachd air a' cheòl a tha air a' choimpiutair agad, cuiridh e taic ri co-roinneadh lìonraidh, pod-chraoladh, sruthadh
    rèidio, uidheaman ciùil so-ghiùlan (a' gabhail a-steach fònaichean) agus seirbheisean ciùil air loidhne mar Last.fm agus
    Magnatune.</p>

    <p>'S e bathar-bog saor a tha sa Rhythmbox 's tha e stèidhichte air GTK+ agus GStreamer. Gabhaidh a leudachadh le plugain
    a ghabhas sgrìobhadh ann an Python no C.</p>
  nl: >-
    <p>Rhythmbox is een muziekbeheerprogramma, ontworpen om goed te werken in de GNOME-werkomgeving. Naast muziek die op uw
    computer is opgeslagen ondersteunt Rhythmbox in een netwerk gedeelde bestanden, podcasts, radiostreams, draagbare muziekapparaten
    (inclusief telefoons) en muziekdiensten op het internet zoals Last.fm en Magnatune.</p>

    <p>Rhythmbox is vrije software, gebaseerd op GTK+ en GStreamer, en is uit te breiden via plug-ins geschreven in Python
    of C.</p>
  eo: >-
    <p>Rhythmnox estas muzika mastruma aplikaĵo kiu funkcias bone en la GNOME labortablo. Krom muzikon sur via komputilo,
    ĝi subtenas retdividejojn, podkastojn, radiofluojn, porteblajn muzikaparatojn (inkluzive telefonojn), kaj retajn muzikservojn
    kiel Last.fm kaj Magnatune.</p>

    <p>Rhythmbox estas libera programaro, bazita sur GTK+ kaj GStreamer, kaj ĝi estas etendebla per Python- kaj C-kromprogramoj.</p>
  cs: >-
    <p>Rhythmbox je aplikace sloužící ke správě hudby a je navržena pro pracovní prostředí GNOME. Mimo hudby uložené ve vašem
    počítači podporuje také síťové sdílení, podcasty, vysílání rádií, přenosné přehrávače (včetně mobilních telefonů) a internetové
    hudební služby, jako je Last.fm a Magnatune.</p>

    <p>Rhythmbox je svobodný software používající GTK+ a GStreamer a je rozšiřitelný pomocí zásuvných modulů psaných v jazycích
    Python nebo C.</p>
