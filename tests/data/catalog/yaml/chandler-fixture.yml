  bg: Музикалния тагер на MusicBrainz
  pl: MusicBrainz Picard służy do edycji metadanych (tagów ID3, znaczników) plików audio
  ms-MY: Penanda muzik MusicBrainz
  pt-BR: Marcador de música do MusicBrainz
  de: MusicBrainz Musik-Tagger
