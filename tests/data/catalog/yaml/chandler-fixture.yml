Description:
  ru: >-
    <p>ReText — это текстовый редактор для языков разметки, таких как Markdown и reStructuredText.</p>

    <p>Он поддерживает вкладки, живой просмотр, синхронную прокрутку и подсветку синтаксиса.</p>

    <p>ReText может экспортировать в форматы HTML, ODT и PDF. Также возможно написание собственных расширений экспорта.</p>
  C: >-
    <p>ReText is a text editor for plain text markup languages, such as Markdown and reStructuredText.</p>

    <p>It supports tabs, live text preview, synchronized scrolling and syntax highlighting.</p>

    <p>ReText can export to HTML, ODT and PDF formats. It is also possible to write custom export extensions.</p>
  de: >-
    <p>ReText ist ein Texteditor für vereinfachten Auszeichnungssprachen wie Markdown und reStructuredText.</p>

    <p>Er unterstützt Reiter, Live-Vorschau, synchrones Scrollen und Syntaxhervorhebung.</p>

    <p>ReText kann Dokumente in HTML, ODT und PDF exportieren. Es ist auch möglich, benutzerdefinierte Export-Erweiterungen
    zu schreiben.</p>
